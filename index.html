<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/dist/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <title>WeatherApp ver.1</title>
</head>

<body>
  <div class="search-bar box-1">
    <input type="text" placeholder="Search for the area" class="search-input">
    <button class="search-btn btn"><i class="fa-solid fa-magnifying-glass"></i></button>
  </div>
  <div class="grid">
    <div class="current-weather card box-2"></div>
    <div class="forecast-7days card box-3">
      <h2>Next 7 days (only 2 days left because the license expired):</h2>
      <div class="forecast">
      </div>
    </div>
    <div class="forecast-12hours card box-4">
      <h2>Following 12 hours: </h2>
      <ul class="forecast-list">
      </ul>
    </div>
    <div class="flag-box card box-5">
      <img src="" alt="" class="flag-img">
    </div>
  </div>
</body>
<script src="app.js" defer></script>

</html>
